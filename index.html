<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MCQ Error Tracker</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#030712">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            amoled: {
              bg: '#030712',
              card: '#080d1a',
              row: '#090e1d',
              border: '#151f32'
            },
            brand: {
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca'
            }
          }
        }
      }
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .dark body {
      background-color: #030712 !important;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
    .spin-fast {
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-amoled-bg text-black dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- Header -->
  <header class="bg-white dark:bg-amoled-card/90 backdrop-blur-md border-b border-slate-200 dark:border-amoled-border sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 h-16 flex items-center justify-between gap-2">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-violet-600 flex items-center justify-center text-white shadow-md shadow-brand-500/20 shrink-0">
          <i data-lucide="crosshair" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-bold text-sm sm:text-base text-black dark:text-white leading-tight">MCQ Error Tracker</h1>
          <div class="flex items-center gap-1.5 text-[11px] text-slate-500 dark:text-slate-400">
            <span id="driveIndicatorDot" class="w-2 h-2 rounded-full bg-slate-300 dark:bg-slate-700 inline-block"></span>
            <span id="syncStatusText" class="truncate max-w-[200px] sm:max-w-xs">Drive Unlinked</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Theme Toggle -->
        <button id="themeToggleBtn" class="p-2 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Toggle Theme">
          <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
          <i data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
        </button>

        <!-- Sync Button -->
        <button id="quickSyncBtn" class="p-2 rounded-xl border border-slate-200 dark:border-amoled-border bg-white dark:bg-amoled-card hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 transition" title="Sync With Drive">
          <i data-lucide="refresh-cw" class="w-4 h-4" id="syncSpinner"></i>
        </button>

        <!-- Settings Button -->
        <button id="openSettingsModalBtn" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl border border-slate-200 dark:border-amoled-border bg-white dark:bg-amoled-card text-black dark:text-slate-200 text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-800 transition">
          <i data-lucide="sliders" class="w-4 h-4 text-brand-500"></i>
          <span>Settings</span>
        </button>

        <!-- Log Error -->
        <button id="openNewLogModalBtn" class="inline-flex items-center gap-1 px-3.5 py-2 rounded-xl bg-brand-600 text-white text-xs sm:text-sm font-semibold hover:bg-brand-700 shadow-md shadow-brand-500/20 active:scale-95 transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Log Error</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-3 sm:px-6 py-4 flex-1 w-full space-y-4">
    <!-- Search & Filters -->
    <section class="bg-white dark:bg-amoled-card p-3 rounded-2xl border border-slate-200 dark:border-amoled-border shadow-xs flex flex-col md:flex-row gap-2.5 items-stretch md:items-center justify-between">
      <div class="relative flex-1">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input type="text" id="searchInput" placeholder="Search Q#, source, subject, chapter or notes..." class="w-full pl-9 pr-3 py-2 text-xs sm:text-sm bg-slate-50 dark:bg-[#0c1222] border border-slate-200 dark:border-amoled-border rounded-xl focus:outline-none focus:ring-1 focus:ring-brand-500 text-black dark:text-white">
      </div>

      <div class="flex flex-wrap sm:flex-nowrap gap-2 items-center">
        <select id="filterSource" class="flex-1 sm:flex-none px-2.5 py-2 text-xs font-semibold bg-slate-50 dark:bg-[#0c1222] border border-slate-200 dark:border-amoled-border rounded-xl text-black dark:text-slate-300 focus:outline-none">
          <option value="ALL">All Sources</option>
        </select>

        <select id="filterSubject" class="flex-1 sm:flex-none px-2.5 py-2 text-xs font-semibold bg-slate-50 dark:bg-[#0c1222] border border-slate-200 dark:border-amoled-border rounded-xl text-black dark:text-slate-300 focus:outline-none">
          <option value="ALL">All Subjects</option>
        </select>

        <select id="filterReviewStatus" class="flex-1 sm:flex-none px-2.5 py-2 text-xs font-semibold bg-slate-50 dark:bg-[#0c1222] border border-slate-200 dark:border-amoled-border rounded-xl text-black dark:text-slate-300 focus:outline-none">
          <option value="ALL">All Status</option>
          <option value="NEW">Unreviewed (0 Reviews)</option>
          <option value="REVIEWED">Reviewed (≥1)</option>
          <option value="FLAGGED">🚩 Flagged</option>
        </select>
      </div>
    </section>

    <!-- Table Container -->
    <div class="bg-white dark:bg-amoled-card rounded-2xl border border-slate-200 dark:border-amoled-border overflow-hidden shadow-xs">
      <div class="overflow-x-auto custom-scrollbar">
        <table class="w-full text-left text-xs whitespace-nowrap">
          <thead class="bg-slate-100/80 dark:bg-[#0a0f1e] text-slate-500 dark:text-slate-400 uppercase tracking-wider font-bold text-[10px] border-b border-slate-200 dark:border-amoled-border">
            <tr>
              <th scope="col" class="py-3 px-3 w-10 text-center">Status</th>
              <th scope="col" class="py-3 px-3">Question #</th>
              <th scope="col" class="py-3 px-3">Source</th>
              <th scope="col" class="py-3 px-3">Subject</th>
              <th scope="col" class="py-3 px-3">
